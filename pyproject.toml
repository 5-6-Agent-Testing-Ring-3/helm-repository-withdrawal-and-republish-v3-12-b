[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chartpub"
version = "0.1.0"
description = "Recoverable publication tooling for a GitHub Pages Helm repository"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
chartpub = "chartpub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chartpub"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/chartpub", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chartpub"]
omit = ["*/chartpub/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true


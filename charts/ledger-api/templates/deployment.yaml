apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ledger-api.fullname" . }}
  labels:
    {{- include "ledger-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ledger-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ledger-api.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        # Must equal spec.selector.matchLabels above: Kubernetes rejects a
        # Deployment whose selector does not match its own pod template, and the
        # Service below selects the same labels. Version 0.4.0 shipped "worker"
        # here, which is why it passed `helm lint` and still failed to install.
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "ledger-api.serviceAccountName" . }}
      containers:
        - name: ledger-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

